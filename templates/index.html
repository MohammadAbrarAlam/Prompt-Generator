<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Prompt Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="hero-wrapper">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8 col-md-10">

                <div class="glass-card p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h1 class="main-title">
                            AI Prompt Generator
                        </h1>

                        <p class="subtitle">
                            Upload image, poster, or short video and generate powerful AI prompts instantly
                        </p>

                    </div>

                    <form action="/generate"
                          method="POST"
                          enctype="multipart/form-data"
                          id="promptForm">

                        <div class="mb-3">
                            <label class="form-label">Content Type</label>
                            <select class="form-select custom-input"
                                    name="media_type"
                                    required>

                                <option selected disabled>Select Type</option>
                                <option>Image</option>
                                <option>Video</option>
                                <option>Poster</option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Prompt Style</label>
                            <select class="form-select custom-input"
                                    name="style"
                                    required>

                                <option selected disabled>Select Style</option>
                                <option>Natural</option>
                                <option>Cinematic</option>
                                <option>Happy</option>
                                <option>Angry</option>
                                <option>Professional</option>
                                <option>Realistic</option>
                                <option>Confident</option>
                                <option>Dramatic</option>
                                <option>Luxury</option>
                                <option>Vintage</option>

                            </select>
                        </div>

                        <div class="mb-4">

                            <label class="form-label">Upload File</label>

                            <div class="upload-box" onclick="document.getElementById('fileInput').click()">

                                <div class="upload-icon">⬆</div>

                                <p class="upload-text">
                                    Click to upload or drag & drop
                                </p>

                                <small id="file-name">
                                    JPG, PNG, MP4 (max 15 sec)
                                </small>

                                <input
                                    type="file"
                                    name="file"
                                    id="fileInput"
                                    hidden
                                    required>

                            </div>
                        </div>

                        <button type="submit"
                                class="btn generate-btn w-100"
                                id="submitBtn">

                            <span id="btnText">
                                Generate Prompt
                            </span>

                            <span id="loader"
                                  class="spinner-border spinner-border-sm ms-2 d-none">
                            </span>

                        </button>

                    </form>

                    {% if generated_prompt %}
                    <div class="output-card mt-4">

                        <h4 class="mb-3">
                            Generated Prompt
                        </h4>

                        <p>
                            {{ generated_prompt }}
                        </p>

                    </div>
                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("file-name");
const form = document.getElementById("promptForm");

fileInput.addEventListener("change", function () {
    if (this.files.length > 0) {
        fileName.textContent = this.files[0].name;
    }
});

form.addEventListener("submit", function () {
    document.getElementById("btnText").innerText = "Generating...";
    document.getElementById("loader").classList.remove("d-none");
});

</script>

</body>
</html>
